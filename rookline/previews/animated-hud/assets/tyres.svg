<svg xmlns="http://www.w3.org/2000/svg" class="lmu-tyres-hud" width="405" height="227" viewBox="0 0 405 227" role="img" aria-label="Four tyre life, pressure and temperature indicators" data-module-version="1.1.0" data-motion="system">
<title>LMU-style tyre page — independent presentation layers</title>
<defs><filter id="tyres-red-glow" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="2.1" result="bloom"/><feMerge><feMergeNode in="bloom"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g id="tyres-backing" data-hud-part="tyres-backing" data-label="Panel backing" style="color:#141522" ><rect x="8" y="1" width="389" height="223" rx="3" fill="currentColor" fill-opacity=".68"/></g>
<g id="tyres-separators" data-hud-part="tyres-separators" data-label="Readout divider lines" style="color:#777883" ><path d="M104 33.5H315 M104 65.5H315 M104 97.5H315 M104 129.5H315 M104 161.5H315 M104 193.5H315" stroke="currentColor" stroke-width=".65" opacity=".58"/></g>
<g id="tyres-heading" data-hud-part="tyres-heading" data-label="Tyres label" style="color:#f5f5fb" ><text x="217" y="118" font-size="13.5" font-weight="700" text-anchor="middle" fill="currentColor" data-role="heading">Tyres</text></g>
<g id="tyres-availability" data-hud-part="tyres-availability" data-label="Remaining tyres / game allocation state" style="color:#f5f5fb" ><text x="183" y="118" font-size="13.5" font-weight="700" text-anchor="middle" fill="currentColor" data-role="availability">—</text></g>
<g data-wheel="fl" data-cx="57" data-cy="50" data-state="unknown" role="group" aria-label="Front left tyre">
