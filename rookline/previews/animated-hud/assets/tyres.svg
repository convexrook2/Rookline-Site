<g id="tyres-fl-life" data-hud-part="tyres-fl-life" data-label="Front left remaining life arc" style="color:#f4f4fc" ><path class="ring" data-role="life-arc" d=""/></g>
<g id="tyres-fl-used" data-hud-part="tyres-fl-used" data-label="Front left worn-away hollow outline" style="color:#656676" ><path class="used-band" data-role="used-band" d=""/></g>
<g id="tyres-fl-wear-warning" data-hud-part="tyres-fl-wear-warning" data-label="Front left worn-away warning glow" style="color:#ff2548" data-runtime-visible="false" visibility="hidden"><g class="wear-pulse"><path class="warning-band" data-role="wear-warning-path" d="" filter="url(#tyres-red-glow)"/></g></g>
