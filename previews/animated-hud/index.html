<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Animated HUD warning previews</title><link rel="stylesheet" href="assets/warnings.css"><style>*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#10131a;color:#e8edf7;font:16px/1.5 system-ui,sans-serif}a{color:#65deed}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #65deed;outline-offset:4px}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{border-bottom:1px solid #394457}h1{font-size:clamp(1.65rem,4vw,2.4rem);line-height:1.2;margin:12px 0}p{color:#bac4d5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.demo{padding:24px;border:1px solid #394457;border-radius:8px}.demo h2{margin-top:0}.demo a{display:inline-block;padding:8px 0}footer{font-size:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
select{font:inherit;color:inherit;background:#222b3b;border:1px solid #536079;padding:10px;max-width:100%}label{display:block;margin-bottom:12px}#rookline-recent-label{margin:12px 0;color:#e8edf7}#rookline-recent-previews .recent-product{background:#10111b;padding:16px;margin-top:12px;max-width:887px}#rookline-recent-previews .recent-compact{display:block}#rookline-recent-previews .recent-compact>svg{width:100%;height:auto;max-height:none}#rookline-recent-previews .recent-tyres{display:block;height:auto;margin-top:16px}#rookline-recent-previews .recent-tyres>svg{width:100%;max-width:430px;height:auto;max-height:none}#rookline-recent-previews.motion-paused *{animation-play-state:paused!important}</style><style>.manufacturer-controls{margin:0 0 16px;padding:12px;border:1px solid #394457}.manufacturer-controls label{display:block;margin:8px 0}.manufacturer-controls select,.manufacturer-controls input{display:block;width:100%;max-width:100%;margin-top:6px}.manufacturer-controls p{font-size:12px}</style></head>
<body><header><a href="../index.html">All previews</a><h1>Animated HUD warnings</h1><p>Simulated data · v1.3 appearance presets, separate from the live application. Six RPM shapes and optional shift-light colours.</p></header><main><div id="rookline-recent-previews">
  <fieldset class="manufacturer-controls"><legend>HUD appearance</legend><label for="preview-style">Style<select id="preview-style"><option value="car-specific">Car-specific style</option><option value="default">Default</option></select></label><label for="preview-car">Preview car<select id="preview-car"></select></label><label for="preview-shift-style">Shift-light colours<select id="preview-shift-style" aria-label="Shift-light colours"><option value="manufacturer">Manufacturer colours</option><option value="native">Original source colours</option></select></label><label for="preview-logo">Temporary preview logo<input id="preview-logo" type="file" accept="image/png,image/jpeg,image/webp"></label><p id="preview-logo-status" role="status"></p></fieldset>
  <div class="viz-controls">
    <label class="form-label" for="rookline-recent-mode">Warning example
      <select class="form-select" id="rookline-recent-mode">
        <option value="detached">Body damage and detached corner</option>
        <option value="pulse">Shared tyre warning pulse</option>
        <option value="flat">Flat tyre and surface colours</option>
        <option value="wear">Low wear and fully worn tyre</option>
        <option value="wing">Detached rear wing</option>
        <option value="heat">Engine overheating and oil warning</option>
        <option value="engine">Engine failure warning</option>
        <option value="clear">Warnings cleared</option>
      </select>
    </label>
  </div>
  <div class="text-small" aria-live="polite" id="rookline-recent-label">Body damage · front-left detached · current readings continue</div>
  <div class="recent-product">
    <div class="lmu-live-drive__layered-hud recent-compact" id="lmuLiveDriveLayeredHudMount">
</div>
    <div class="lmu-live-drive__tyre-module recent-tyres">
</div>
  </div>
  <div role="alert" id="rookline-recent-error" hidden></div>
  <div><label><input id="pause-motion" type="checkbox"> Pause warning motion</label></div>
</div>
</main><footer><a href="assets/LIVE-FONT-LICENSE.txt">Roboto font licence</a> · <a href="assets/FONT-LICENSE.txt">Original numeral font licence</a></footer><script src="assets/hud-controller.js"></script>

<script src="assets/tyres-controller.js"></script>
<script src="assets/lmu-live-drive-hud-adapter.js"></script><script src="assets/lmu-live-drive-presentation.js"></script><script src="assets/current-fixtures.js"></script><script src="assets/catalogue.js"></script><script src="assets/manufacturer-skins.js"></script><script src="assets/manufacturer-preview.js"></script><script src="preview.js"></script></body></html>
